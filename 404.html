<!DOCTYPE html>
<html lang="en" data-theme="dark" data-glass-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found">
    <meta name="theme-color" content="#0a0812">
    <title>404 - Page Not Found | Serene</title>
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/glass.css">
    <link rel="stylesheet" href="/assets/site.css">
</head>
<body class="page-404">
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs>
        <filter id="glass-refract" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="9" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="48" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="glass-specular" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="bump"/>
          <feSpecularLighting in="bump" surfaceScale="12" specularConstant="1.3" specularExponent="18" lighting-color="#ffffff" result="spec">
            <fePointLight x="120" y="-30" z="120"/>
          </feSpecularLighting>
          <feComposite in="spec" in2="SourceAlpha" operator="in"/>
        </filter>
      </defs>
    </svg>

    <div class="ambient" aria-hidden="true">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <div class="theme-seg glass glass--l2 glass-pill" role="group" aria-label="Theme">
        <button type="button" data-theme-set="dark" title="Dark" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button type="button" data-theme-set="light" title="Light" aria-label="Light theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button type="button" data-theme-set="system" title="System" aria-label="System theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
    </div>

    <main>
        <div class="card-404 glass glass--l2 glass--l3 glass--clear glass--fresnel glass-card">
            <div class="logo-mini glass glass--l2 glass--l3" id="logo-wrap" role="button" tabindex="0" aria-label="Replay lotus bloom">
                <svg class="lotus-mark" id="lotus-svg" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Serene">
                    <defs>
                        <radialGradient id="petalGrad" gradientUnits="userSpaceOnUse" cx="128" cy="216" r="182">
                            <stop offset="0%" stop-color="#A9F2FA"/>
                            <stop offset="50%" stop-color="#CADBFB"/>
                            <stop offset="100%" stop-color="#EEE6FC"/>
                        </radialGradient>
                    </defs>
                    <path class="petal" style="--i:2" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M128 38 C166 68 194 140 128 216 C62 140 90 68 128 38 Z"/>
                    <path class="petal" style="--i:1" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M35 86 C108 118 142 172 128 216 C50 202 29 140 35 86 Z"/>
                    <path class="petal" style="--i:3" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M221 86 C148 118 114 172 128 216 C206 202 227 140 221 86 Z"/>
                    <path class="petal" style="--i:0" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M2 156 C36 142 104 152 128 216 C78 227 20 204 2 156 Z"/>
                    <path class="petal" style="--i:4" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M254 156 C220 142 152 152 128 216 C178 227 236 204 254 156 Z"/>
                </svg>
            </div>
            <div class="code">404</div>
            <h1>Page not found</h1>
            <p>This page seems to have wandered off. Let’s bring you back to the calm.</p>
            <a href="/" class="btn btn-primary glass glass--l2 glass-button glass-button--prominent">Return Home</a>
        </div>
    </main>

    <script>
        (function () {
            const root = document.documentElement;
            const meta = document.querySelector('meta[name="theme-color"]');
            const buttons = document.querySelectorAll('[data-theme-set]');
            const mq = matchMedia('(prefers-color-scheme: dark)');
            let pref = localStorage.getItem('serene-theme') || 'system';

            function resolved(p) {
                if (p === 'system') return mq.matches ? 'dark' : 'light';
                return p;
            }

            function apply(p) {
                const t = resolved(p);
                root.setAttribute('data-theme', t);
                root.setAttribute('data-glass-theme', t);
                if (meta) meta.setAttribute('content', t === 'dark' ? '#0a0812' : '#e8eaf8');
                buttons.forEach(function (b) { b.classList.toggle('active', b.dataset.themeSet === p); });
            }

            apply(pref);
            buttons.forEach(function (b) {
                b.addEventListener('click', function () {
                    pref = b.dataset.themeSet;
                    localStorage.setItem('serene-theme', pref);
                    apply(pref);
                });
            });
            mq.addEventListener('change', function () { if (pref === 'system') apply('system'); });

            const wrap = document.getElementById('logo-wrap');
            const lotus = document.getElementById('lotus-svg');
            const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
            let bloomGen = 0;
            let breatheAnims = [];

            function petals() {
                return lotus ? Array.from(lotus.querySelectorAll('.petal')) : [];
            }

            function stopBreathing() {
                breatheAnims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
                breatheAnims = [];
            }

            function startBreathing(gen) {
                if (gen !== bloomGen || reduceMotion.matches) return;
                stopBreathing();
                petals().forEach(function (petal) {
                    var i = parseFloat(getComputedStyle(petal).getPropertyValue('--i')) || 0;
                    breatheAnims.push(petal.animate(
                        [
                            { transform: 'scale(1)' },
                            { transform: 'scale(1.025)' },
                            { transform: 'scale(1)' }
                        ],
                        { duration: 4800, delay: i * 80, iterations: Infinity, easing: 'ease-in-out' }
                    ));
                });
            }

            function bloom() {
                if (!lotus) return;
                var gen = ++bloomGen;
                stopBreathing();
                var list = petals();
                list.forEach(function (petal) {
                    petal.getAnimations().forEach(function (a) { try { a.cancel(); } catch (e) {} });
                    petal.style.transform = '';
                    petal.style.opacity = '';
                });
                if (reduceMotion.matches) {
                    list.forEach(function (petal) {
                        petal.style.transform = 'scale(1)';
                        petal.style.opacity = '1';
                    });
                    return;
                }
                Promise.all(list.map(function (petal) {
                    var i = parseFloat(getComputedStyle(petal).getPropertyValue('--i')) || 0;
                    return petal.animate(
                        [
                            { transform: 'scale(0.2)', opacity: 0 },
                            { transform: 'scale(1)', opacity: 1 }
                        ],
                        {
                            duration: 780,
                            delay: i * 55,
                            easing: 'cubic-bezier(0.23, 1, 0.32, 1)',
                            fill: 'forwards'
                        }
                    ).finished.catch(function () {});
                })).then(function () {
                    if (gen !== bloomGen) return;
                    list.forEach(function (petal) {
                        petal.getAnimations().forEach(function (a) { try { a.cancel(); } catch (e) {} });
                        petal.style.transform = 'scale(1)';
                        petal.style.opacity = '1';
                    });
                    startBreathing(gen);
                });
            }
            setTimeout(bloom, 200);
            wrap.addEventListener('click', bloom);
            wrap.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bloom(); }
            });
        })();
    </script>
</body>
</html>
