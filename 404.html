<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — Serene">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0a0812">
    <meta name="robots" content="noindex">
    <script>
      (function () {
        var pref = localStorage.getItem('serene-theme') || 'system';
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-glass-theme', theme);
        var scheme = pref === 'system' ? 'light dark' : theme;
        var cs = document.querySelector('meta[name="color-scheme"]');
        var tc = document.querySelector('meta[name="theme-color"]');
        if (cs) cs.setAttribute('content', scheme);
        if (tc) tc.setAttribute('content', dark ? '#0a0812' : '#e8eaf8');
      })();
    </script>
    <title>404 - Page Not Found | Serene</title>
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/icon-7.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/glass.css">
    <link rel="stylesheet" href="/assets/site.css">
</head>
<body class="page-404">
    <a class="skip-link glass glass--l2 glass-button" href="#content">Skip to content</a>

    <div class="ambient" aria-hidden="true">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header">
        <div class="glass glass--l2 glass-nav">
            <nav class="nav-inner" aria-label="Primary">
                <a class="brand" href="/">
                    <span class="brand-mark"><img src="/assets/lotus.svg" alt="" width="24" height="24" decoding="async"></span>
                    <span class="brand-name">Serene</span>
                </a>
                <ul class="nav-links nav-links--inline">
                    <li><a href="/">Home</a></li>
                    <li><a href="/#download">Download</a></li>
                    <li><a href="/privacy.html">Privacy</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="theme-seg glass glass--l2 glass-pill" role="group" aria-label="Theme">
        <button type="button" data-theme-set="dark" title="Dark" aria-label="Dark theme" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button type="button" data-theme-set="light" title="Light" aria-label="Light theme" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button type="button" data-theme-set="system" title="System" aria-label="System theme" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
    </div>

    <main id="content">
        <div class="card-404 glass glass--l2 glass-card">
            <button class="logo-mini glass glass--l2" id="logo-wrap" type="button" aria-label="Replay lotus bloom">
                <svg class="lotus-mark" id="lotus-svg" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <defs>
                        <radialGradient id="petalGrad" gradientUnits="userSpaceOnUse" cx="128" cy="216" r="182">
                            <stop offset="0%" stop-color="#A9F2FA"/>
                            <stop offset="50%" stop-color="#CADBFB"/>
                            <stop offset="100%" stop-color="#EEE6FC"/>
                        </radialGradient>
                    </defs>
                    <path class="petal" style="--i:2" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M128 38 C166 68 194 140 128 216 C62 140 90 68 128 38 Z"/>
                    <path class="petal" style="--i:1" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M35 86 C108 118 142 172 128 216 C50 202 29 140 35 86 Z"/>
                    <path class="petal" style="--i:3" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M221 86 C148 118 114 172 128 216 C206 202 227 140 221 86 Z"/>
                    <path class="petal" style="--i:0" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M2 156 C36 142 104 152 128 216 C78 227 20 204 2 156 Z"/>
                    <path class="petal" style="--i:4" fill="url(#petalGrad)" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" d="M254 156 C220 142 152 152 128 216 C178 227 236 204 254 156 Z"/>
                </svg>
            </button>
            <p class="eyebrow glass glass--l2 glass-badge">Lost the path</p>
            <p class="code" aria-hidden="true">404</p>
            <h1>Page not found</h1>
            <p>This page seems to have wandered off. Let’s bring you back to the calm.</p>
            <a href="/" class="btn btn-primary glass glass--l2 glass-button glass-button--prominent">Return Home</a>
        </div>
    </main>

    <footer class="site-footer wrap">
        <div class="footer-bar glass glass--l2">
            <p class="footer-copy">&copy; 2026 Serene</p>
            <div class="links">
                <a href="/privacy.html">Privacy</a>
                <a href="https://discord.gg/S7pPBy7eR" target="_blank" rel="noopener noreferrer">Discord</a>
            </div>
        </div>
    </footer>

    <script>
        (function () {
            const root = document.documentElement;
            const metaScheme = document.querySelector('meta[name="color-scheme"]');
            const metaColor = document.querySelector('meta[name="theme-color"]');
            const buttons = document.querySelectorAll('[data-theme-set]');
            const mq = matchMedia('(prefers-color-scheme: dark)');
            let pref = localStorage.getItem('serene-theme') || 'system';

            function resolved(p) {
                if (p === 'system') return mq.matches ? 'dark' : 'light';
                return p;
            }

            function apply(p) {
                const t = resolved(p);
                root.setAttribute('data-theme', t);
                root.setAttribute('data-glass-theme', t);
                if (metaScheme) metaScheme.setAttribute('content', p === 'system' ? 'light dark' : t);
                if (metaColor) metaColor.setAttribute('content', t === 'dark' ? '#0a0812' : '#e8eaf8');
                buttons.forEach(function (b) {
                    const on = b.dataset.themeSet === p;
                    b.classList.toggle('active', on);
                    b.setAttribute('aria-pressed', on ? 'true' : 'false');
                });
            }

            apply(pref);
            buttons.forEach(function (b) {
                b.addEventListener('click', function () {
                    pref = b.dataset.themeSet;
                    localStorage.setItem('serene-theme', pref);
                    apply(pref);
                });
            });
            mq.addEventListener('change', function () { if (pref === 'system') apply('system'); });

            const wrap = document.getElementById('logo-wrap');
            const lotus = document.getElementById('lotus-svg');
            const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
            let bloomGen = 0;
            let breatheAnims = [];

            function petals() {
                return lotus ? Array.from(lotus.querySelectorAll('.petal')) : [];
            }

            function stopBreathing() {
                breatheAnims.forEach(function (a) { try { a.cancel(); } catch (e) {} });
                breatheAnims = [];
            }

            function startBreathing(gen) {
                if (gen !== bloomGen || reduceMotion.matches) return;
                stopBreathing();
                petals().forEach(function (petal) {
                    var i = parseFloat(getComputedStyle(petal).getPropertyValue('--i')) || 0;
                    breatheAnims.push(petal.animate(
                        [
                            { transform: 'scale(1)' },
                            { transform: 'scale(1.025)' },
                            { transform: 'scale(1)' }
                        ],
                        { duration: 4800, delay: i * 80, iterations: Infinity, easing: 'ease-in-out' }
                    ));
                });
            }

            function bloom() {
                if (!lotus) return;
                var gen = ++bloomGen;
                stopBreathing();
                var list = petals();
                list.forEach(function (petal) {
                    petal.getAnimations().forEach(function (a) { try { a.cancel(); } catch (e) {} });
                    petal.style.transform = '';
                    petal.style.opacity = '';
                });
                if (reduceMotion.matches) {
                    list.forEach(function (petal) {
                        petal.style.transform = 'scale(1)';
                        petal.style.opacity = '1';
                    });
                    return;
                }
                Promise.all(list.map(function (petal) {
                    var i = parseFloat(getComputedStyle(petal).getPropertyValue('--i')) || 0;
                    return petal.animate(
                        [
                            { transform: 'scale(0.2)', opacity: 0 },
                            { transform: 'scale(1)', opacity: 1 }
                        ],
                        {
                            duration: 780,
                            delay: i * 55,
                            easing: 'cubic-bezier(0.23, 1, 0.32, 1)',
                            fill: 'forwards'
                        }
                    ).finished.catch(function () {});
                })).then(function () {
                    if (gen !== bloomGen) return;
                    list.forEach(function (petal) {
                        petal.getAnimations().forEach(function (a) { try { a.cancel(); } catch (e) {} });
                        petal.style.transform = 'scale(1)';
                        petal.style.opacity = '1';
                    });
                    startBreathing(gen);
                });
            }
            setTimeout(bloom, 200);
            if (wrap) wrap.addEventListener('click', bloom);
        })();
    </script>
</body>
</html>
