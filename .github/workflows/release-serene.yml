name: Release Serene

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: serene-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: serene-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows zip
        run: npm run release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            serene-app/release/Serene-Windows-v*.zip
            serene-app/release/Serene-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
